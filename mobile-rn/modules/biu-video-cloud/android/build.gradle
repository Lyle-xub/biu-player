plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.biuvideocloud'
version = '1.0.0'
android {
  ndkVersion rootProject.ext.ndkVersion
  namespace 'expo.modules.biuvideocloud'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    externalNativeBuild { cmake { cppFlags '-std=c++17 -O2'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
  }
  externalNativeBuild { cmake { path 'CMakeLists.txt' } }
}
